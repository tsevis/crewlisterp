name: CrewListr Pro Python release gate

# Moved here from the crewlistr monorepo, where this project lived in a
# `crewlisterpro/` subdirectory. That subdirectory is now this repository's
# root, so the path filters and every `working-directory` it carried are gone.
# `mypy crewlisterpro` is unchanged: the *package* is still `crewlisterpro/`,
# it simply sits at the root rather than one level down.

on:
  # Filtered to main deliberately. Unfiltered, a branch push and the pull
  # request that follows it each ran the full `quality` matrix, so every
  # PR billed its `windows-2022` leg TWICE -- the one job here that has
  # nowhere to go but GitHub's runners. `pull_request` still covers the
  # branch, so nothing goes unchecked; only the duplicate is gone.
  #
  # Safe to make `quality` a required check, unlike a PATH filter: this
  # narrows which branches trigger a push run, and the pull_request
  # trigger below is unfiltered.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# ONE RUN IN FLIGHT PER REF, ON EVERY REF: the newest run wins. There was no
# concurrency block at all, so pushing twice to a branch queued two full runs
# and the second waited for the first -- for a verdict nobody would read.
#
# The wait is not hypothetical here even though half this matrix is hosted:
# `hosted-allowance` and the Linux leg of `quality` run on the Mac Studio,
# which is shared with every other repository's self-hosted runners and has sat
# at load 50 on 20 cores. A superseded run of those legs makes something else
# wait. And while the allowance is out, the hosted legs do not exist at all, so
# every job in this workflow is on that one box.
#
# `github.run_id` for a manual dispatch, so two deliberate runs of the same ref
# do not cancel each other -- someone who presses the button twice means it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  hosted-allowance:
    # Can this repository use GitHub's runners today?
    #
    # 2026-09-06: the account's 3,000 included minutes ran out. GitHub does not
    # FAIL a hosted job when that happens -- it refuses to START it, so the job
    # ends in seconds with no steps and reads on the checks list exactly like a
    # code regression. Everything below is gated on this instead, so a red run
    # keeps meaning "the code broke".
    #
    # What is genuinely lost while this is armed: Windows is not tested, and a
    # tag builds neither the Windows installer nor the x86_64 AppImage. Neither
    # has anywhere to go on an arm64 Mac. This job SAYS SO on every run -- a
    # gate that skips in silence is how one rots unnoticed.
    #
    # Armed by the HOSTED_BLOCKED_UNTIL repository variable (a YYYY-MM-DD reset
    # date). It disarms itself on that date; clearing the variable disarms it
    # at once.
    #
    # AND IT IS ALSO DISARMED BY THIS REPOSITORY BEING PUBLIC, which is the
    # case it was not written for. The allowance is spent by PRIVATE
    # repositories; standard GitHub-hosted runners are free in public ones.
    # Measured 2026-09-16 on tsevis/philon-python, also public, on its first
    # hosted run: `/actions/runs/<id>/timing` answered
    #
    #     {"UBUNTU":{"jobs":1,"total_ms":0}}
    #
    # -- zero billable milliseconds. So while this repository is public the
    # allowance cannot be the thing stopping a job, and withholding Windows
    # for it withholds the only coverage Windows has for no saving at all.
    #
    # NOT ON THE MAC ANY MORE. This job used to run on `[self-hosted, linux]`
    # "so it costs nothing to ask" -- and then this repository went public.
    # `tsevisrunner status`, 2026-09-16:
    #
    #   PUBLIC — NO RUNNER WILL BE STARTED
    #     crewlisterp  linux down -- this app did not stop it
    #
    # That refusal is right: on a public repository a `pull_request` workflow
    # runs the author's code, anyone can be the author, and it would run on
    # that Mac as its owner with its SSH keys. So the label was asking for a
    # runner that could never arrive -- and because EVERY job below `needs`
    # this one, the whole workflow stopped. One run sat queued from
    # 2026-09-15T15:36:41Z, thirteen hours, with nothing counting: a job's
    # `timeout-minutes` only starts once it is picked up.
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
      quality_matrix: ${{ steps.check.outputs.quality_matrix }}
    steps:
      - name: Are GitHub's runners usable?
        id: check
        env:
          BLOCKED_UNTIL: ${{ vars.HOSTED_BLOCKED_UNTIL }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          # `os` names the platform for the job title; `runner` is where it
          # executes. Linux goes to the Mac Studio and is never affected;
          # Windows is the leg that disappears while the allowance is out.
          # Hosted, for the reason in this job's own comment: a public
          # repository gets no self-hosted runner from this fleet, so the Mac
          # Studio is not somewhere this leg can go.
          linux='{"os":"ubuntu-24.04","runner":"ubuntu-24.04"}'
          windows='{"os":"windows-2022","runner":"windows-2022"}'
          today=$(date -u +%Y%m%d)
          target=$(printf '%s' "${BLOCKED_UNTIL:-}" | tr -d '-')
          ok=yes

          # A public repository does not spend the allowance, so it cannot be
          # out of it. Checked before the date, because the date is a guess
          # about when a BILLED account resets and this is a fact about now.
          # `= false`, not `!= true`: an event whose payload carries no
          # `repository.private` would read as public under the second
          # spelling and turn the gate off for a PRIVATE repository, which is
          # the one case it exists for. Unknown falls through to the date.
          if [ "${IS_PRIVATE}" = "false" ]; then
            echo "::notice title=Public repository::Standard GitHub-hosted runners are free here, so the allowance gate does not apply and Windows is tested. Measured 2026-09-16 on a sibling public repository: total_ms=0 billable."
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "quality_matrix=[$linux,$windows]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$target" in
            ''|*[!0-9]*)
              echo "HOSTED_BLOCKED_UNTIL is unset or not a YYYY-MM-DD date; treating GitHub's runners as usable."
              ;;
            *)
              if [ "$today" -ge "$target" ]; then
                echo "::notice title=Hosted runners are back::Past $BLOCKED_UNTIL. Clear the HOSTED_BLOCKED_UNTIL variable to retire this gate."
              else
                ok=no
              fi
              ;;
          esac
          if [ "$ok" = yes ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "quality_matrix=[$linux,$windows]" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "quality_matrix=[$linux]" >> "$GITHUB_OUTPUT"
            echo "::warning title=Windows is not being tested::The account's Actions allowance is exhausted, so hosted jobs are refused before they start. Until $BLOCKED_UNTIL this workflow tests Linux ONLY, and a tag will build neither the Windows installer nor the x86_64 AppImage. Windows breakage in this window would be undetected, not absent."
          fi

  quality:
    needs: hosted-allowance
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Built by hosted-allowance, which holds the Windows leg back while
        # GitHub is refusing to start hosted jobs. It has to be withheld here
        # rather than skipped with an `if:`: `matrix` is not one of the
        # contexts available to a job-level `if:`, so a condition there cannot
        # see which leg it is looking at.
        include: ${{ fromJSON(needs.hosted-allowance.outputs.quality_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy crewlisterpro
      - run: python -m pytest -q

  # Packaging runs only for a tag, or when someone asks for it by hand.
  #
  # Quality is the gate that has to run on every commit; building a Windows
  # installer and a Linux AppImage on each one costs minutes to tell us what we
  # already knew. `workflow_dispatch` is kept as the escape hatch, so the
  # packaging path can be exercised without cutting a tag — otherwise the only
  # way to test a change to the build scripts is to perform a release.
  package-windows:
    name: Windows installer
    runs-on: windows-2022
    needs: [quality, hosted-allowance]
    if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        && needs.hosted-allowance.outputs.available == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m pip install .
      - run: choco install innosetup --no-progress --yes
      - shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CrewListrPro-Windows
          path: dist/installer/CrewListrPro-Setup.exe

  package-linux:
    name: Linux AppImage
    # tsevisrunner: keep-hosted x86_64 AppImage; the Linux runners are arm64
    runs-on: ubuntu-24.04
    needs: [quality, hosted-allowance]
    if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        && needs.hosted-allowance.outputs.available == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m pip install .
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - run: curl -L -o /tmp/appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
      - run: chmod +x /tmp/appimagetool.AppImage && sudo mv /tmp/appimagetool.AppImage /usr/local/bin/appimagetool
      - run: ./scripts/build-linux.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: CrewListrPro-Linux
          path: dist/CrewListrPro-x86_64.AppImage
