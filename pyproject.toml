[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crewlisterpro"
version = "0.1.0"
description = "Private, offline crew-list preparation for Windows and Linux"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<46",
  "Pillow>=10,<12",
  "pydantic>=2.8,<3",
  "pypdfium2>=4.30,<5",
  "PySide6>=6.8,<7",
  "reportlab>=4.2,<5",
  "sqlcipher3>=0.6,<0.7",
]

[project.optional-dependencies]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[project.scripts]
crewlisterpro = "crewlisterpro.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "sqlcipher3.*", "pypdfium2"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "crewlisterpro.app"
ignore_errors = true

[tool.setuptools.packages.find]
include = ["crewlisterpro*"]
